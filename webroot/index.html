<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pairip Disabler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pairip Disabler</h1>
        <p>Select apps to disable Pairip license activity.</p>
        
        <input type="text" id="searchInput" placeholder="Search apps by package name..." class="search-bar">
        
        <div id="appList" class="app-list"></div>
        
        <button id="saveButton" class="save-button">Save</button>
        
        <div id="status" class="status"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
